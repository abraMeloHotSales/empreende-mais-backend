services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empreende-mais-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - FRONTEND_URL=http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
